spring.application.name=concorrencia-bancaria

# ---------------------------------------------------------------------------
# Banco de dados H2 em memoria
# LOCK_TIMEOUT alto evita que o atraso artificial gere timeout de lock e
# mascare o efeito que queremos demonstrar (lost update / conflito de versao).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:bancodb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2 -> http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:bancodb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Atraso artificial (ms) aplicado DENTRO da transacao, entre a leitura e a
# escrita do saldo. Serve apenas para ALARGAR a janela de corrida e tornar o
# problema de concorrencia reprodutivel nos testes. Use 0 para desativar.
# ---------------------------------------------------------------------------
app.delay-ms=50
